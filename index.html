<style>
:root {
  --pink: #FFB6C1;
  --lavender: #E6E6FA;
  --mint: #B5EAD7;
  --sky: #B0E0E6;
  --yellow: #FFF9C4;
  --nude: #F5E6D3;
  --pink-d: #FF69B4;
  --lavender-d: #9B8EC4;
  --mint-d: #66BB9A;
  --sky-d: #5F9EA0;
  --yellow-d: #FBC02D;
  --bg: #FAFAFA;
  --card-bg: #FFFFFF;
  --text: #333333;
  --text-sub: #666666;
  --border: #E8E8E8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 0 60px 0;
}
.header {
  background: linear-gradient(135deg, #FFB6C1 0%, #E6E6FA 50%, #B5EAD7 100%);
  padding: 32px 24px 28px;
  text-align: center;
}
.header h1 { font-size: 26px; font-weight: 700; color: #444; margin-bottom: 6px; }
.header p { font-size: 13px; color: #777; }
.header .update-time { font-size: 12px; color: #999; margin-top: 8px; }
.container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

/* KPI Cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: -20px 0 24px;
}
.kpi-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  text-align: center;
  transition: transform 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); }
.kpi-card .icon { font-size: 22px; margin-bottom: 4px; }
.kpi-card .value { font-size: 24px; font-weight: 700; line-height: 1.2; }
.kpi-card .label { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
.kpi-card .sub { font-size: 11px; color: #999; margin-top: 2px; }
.k-pink .value { color: #E91E63; }
.k-lavender .value { color: #7C4DFF; }
.k-mint .value { color: #00BFA5; }
.k-sky .value { color: #0097A7; }
.k-yellow .value { color: #F9A825; }
.k-nude .value { color: #8D6E63; }

/* Section */
.section { margin-bottom: 28px; }
.section-title {
  font-size: 16px; font-weight: 600; margin-bottom: 12px;
  padding-left: 10px; border-left: 4px solid var(--pink-d);
}

/* Charts row */
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}
.chart-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.chart-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #555; }
.chart-box { position: relative; height: 220px; }

/* Filters */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.filter-bar input, .filter-bar select {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--pink-d); }
.filter-bar input { min-width: 200px; }
.filter-bar .btn-export {
  margin-left: auto;
  padding: 7px 16px;
  background: var(--pink-d);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.filter-bar .btn-export:hover { background: #E91E63; }

/* Table */
.table-wrap {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  background: #F8F5FA;
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: #555;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}
thead th:hover { background: #F0EBF5; }
thead th .sort-arrow { font-size: 10px; opacity: 0.5; }
tbody td {
  padding: 8px 8px;
  border-bottom: 1px solid #F0F0F0;
  white-space: nowrap;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}
tbody tr:hover { background: #FAF5FA; }
tbody tr:nth-child(even) { background: #FCFCFD; }
tbody tr:nth-child(even):hover { background: #FAF5FA; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge-green { background: #E8F5E9; color: #2E7D32; }
.badge-gray { background: #F5F5F5; color: #999; }
.badge-blue { background: #E3F2FD; color: #1565C0; }
.badge-pink { background: #FCE4EC; color: #C2185B; }
.badge-purple { background: #F3E5F5; color: #7B1FA2; }
.badge-yellow { background: #FFF9C4; color: #F57F17; }
.badge-red { background: #FFEBEE; color: #C62828; }

.link-cell a {
  color: var(--sky-d);
  text-decoration: none;
  font-size: 12px;
}
.link-cell a:hover { text-decoration: underline; }

.stat-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-sub);
}
.stat-bar span { font-weight: 600; color: var(--text); }

/* Responsive */
@media (max-width: 900px) {
  .charts-row { grid-template-columns: 1fr; }
}
</style>
</head>

</div>

// === HELPERS ===
function parseFollowers(v) {
  if (v == null || v === '') return 0;
  let s = String(v).trim().toLowerCase();
  let num = parseFloat(s);
  if (s.includes('m')) return num * 1000000;
  if (s.includes('w')) return num * 10000;
  if (s.includes('k')) return num * 1000;
  return num || 0;
}
function fmtNum(v) {
  if (v == null || v === '') return '-';
  let n = Number(v);
  if (isNaN(n)) return String(v);
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 10000) return (n/10000).toFixed(1)+'w';
  return n.toLocaleString();
}
function fmtGMV(v) {
  if (v == null || v === '') return '-';
  let n = Number(v);
  if (isNaN(n)) return '-';
  return '$'+n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
}
function cleanName(s) {
  return String(s||'').replace(/\n/g,' ').trim();
}
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

      datasets: [{ data: statusData, backgroundColor: statusColors.slice(0, statusLabels.length), borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position:'bottom', labels:{font:{size:11}} } } }
  });

  // GMV top 10
  const gmvData = data
    .map(d => ({ name: d._name, gmv: Number(String(d['归因GMV($)']).replace(/,/g,''))||0 }))
    .filter(d => d.gmv > 0)
    .sort((a,b) => b.gmv - a.gmv)
    .slice(0, 10);
  new Chart(document.getElementById('chartGMV'), {
    type: 'bar',
    data: {
      labels: gmvData.map(d => d.name.length > 12 ? d.name.slice(0,10)+'..' : d.name),
      datasets: [{ label: 'GMV ($)', data: gmvData.map(d => d.gmv), backgroundColor: '#FFB6C1', borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } }
    }
  });
}

// === TABLE ===
let sortKey = '', sortDir = 1;

function renderTable() {
  // Head
  const head = document.getElementById('tableHead');
  head.innerHTML = '<tr>' + COLS.map(c =>
    `<th onclick="toggleSort('${c.key}')" title="点击排序">${c.label}${sortKey===c.key?(sortDir>0?' ▲':' ▼'):'<span class="sort-arrow">⇅</span>'}</th>`
  ).join('') + '</tr>';

  // Filter
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const fReply = document.getElementById('filterReply').value;
  const fBrief = document.getElementById('filterBrief').value;
  const fQuote = document.getElementById('filterQuote').value;
  const sortByVal = document.getElementById('sortBy').value;

  let filtered = data.filter(d => {
    if (search) {
      const hay = (d._name + ' ' + (d['邮箱']||'') + ' ' + (d['达人画像']||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (fReply && d['第一封是否回复'] !== fReply) return false;
    if (fBrief && d['brief发送'] !== fBrief) return false;
    if (fQuote && d['报价'] !== fQuote) return false;
    return true;
  });

  // Sort
  if (sortByVal) {
    sortKey = sortByVal;
  }
  if (sortKey) {
    const col = COLS.find(c => c.key === sortKey);
    filtered.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (col && col.type === 'followers') {
        va = a._followers; vb = b._followers;
      } else if (col && (col.type === 'num' || col.type === 'gmv' || col.type === 'percent')) {
        va = Number(String(va).replace(/,/g,''))||0;
        vb = Number(String(vb).replace(/,/g,''))||0;
      } else {
        va = String(va||''); vb = String(vb||'');
      }
      if (va < vb) return -sortDir;
      if (va > vb) return sortDir;
      return 0;
    });
  }

  // Body
  const body = document.getElementById('tableBody');
  body.innerHTML = filtered.map(d => {
    return '<tr>' + COLS.map(c => {
      const v = d[c.key];
      if (v == null || v === '') return '<td style="color:#ccc">-</td>';
      switch(c.type) {
        case 'check':
          return `<td style="text-align:center;font-size:16px">${v === '☑' ? '<span style="color:#2E7D32">✓</span>' : '<span style="color:#ccc">○</span>'}</td>`;
        case 'badge': {
          let cls = 'badge-gray';
          if (v === '置换') cls = 'badge-green';
          else if (v === '谈价中') cls = 'badge-yellow';
          return `<td><span class="badge ${cls}">${escapeHtml(v)}</span></td>`;
        }
        case 'followers':
          return `<td>${fmtNum(parseFollowers(v))}</td>`;
        case 'num':
          return `<td>${fmtNum(v)}</td>`;
        case 'percent':
          return `<td>${v}%</td>`;
        case 'gmv':
          return `<td style="font-weight:600;color:#E91E63">${fmtGMV(v)}</td>`;
        case 'link': {
          let url = String(v).trim();
          if (!url.startsWith('http')) return `<td style="color:#ccc;font-size:11px">${escapeHtml(url.slice(0,15))}</td>`;
          return `<td class="link-cell"><a href="${escapeHtml(url)}" target="_blank">链接</a></td>`;
        }
        default:
          return `<td title="${escapeHtml(v)}">${escapeHtml(cleanName(v).slice(0,30))}</td>`;
      }
    }).join('') + '</tr>';
  }).join('');

  // Stats
  document.getElementById('statBar').innerHTML =
    `显示 <span>${filtered.length}</span> / ${data.length} 条 · ` +
    `已回复 <span style="color:#2E7D32">${filtered.filter(d=>d['第一封是否回复']==='☑').length}</span> · ` +
    `未回复 <span style="color:#999">${filtered.filter(d=>d['第一封是否回复']==='☐').length}</span>`;
}

function toggleSort(key) {
  if (sortKey === key) { sortDir = -sortDir; }
  else { sortKey = key; sortDir = 1; }
  document.getElementById('sortBy').value = '';
  renderTable();
}

function exportCSV() {
  const headers = COLS.map(c => c.label);
  const rows = data.map(d => COLS.map(c => {
    let v = d[c.key];
    if (v == null) v = '';
    return '"' + String(v).replace(/"/g,'""') + '"';
  }));
  const csv = '\uFEFF' + [headers.map(h=>'"'+h+'"').join(',')].concat(rows.map(r=>r.join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '陈嘉曦红人建联进度.csv'; a.click();
  URL.revokeObjectURL(url);
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('filterReply').addEventListener('change', renderTable);
document.getElementById('filterBrief').addEventListener('change', renderTable);
document.getElementById('filterQuote').addEventListener('change', renderTable);
document.getElementById('sortBy').addEventListener('change', renderTable);

// Init
renderKPI();
renderCharts();
renderTable();
</script>
</body>
